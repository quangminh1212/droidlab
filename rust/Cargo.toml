[workspace]
resolver = "2"
# The controller is a workspace member so that `cargo test --workspace` at the repository root
# exercises it, and so that it links `droidlab-protocol` by path rather than by version. ADR-0009
# rule R8 depends on that link being structural: the controller is supposed to use the core, not
# re-implement it, and a path dependency in the same workspace makes the wrong thing the harder
# thing to do.
members = ["crates/droidlab-protocol", "controller/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/quangminh1212/droidlab"
authors = ["DroidLab contributors"]

[workspace.dependencies]
# Cryptography. Every primitive DLWP/1 names is supplied by a RustCrypto crate rather than
# implemented here: RFC-0002 forbids inventing primitives, and a hand-written AES-GCM would be
# unauditable.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
hkdf = { version = "0.12", default-features = false }
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
ed25519-dalek = { version = "2", default-features = false }
rand_core = { version = "0.6", default-features = false }
subtle = { version = "2", default-features = false }
zeroize = { version = "1", default-features = false, features = ["alloc"] }

# Test-only. The vectors are JSON, and hand-parsing them would be a second implementation of the
# thing under test.
serde_json = "1"
hex = "0.4"
base64 = "0.22"

# The protocol core, by path. Every controller dependency on DLWP/1 goes through this line.
droidlab-protocol = { path = "crates/droidlab-protocol" }
